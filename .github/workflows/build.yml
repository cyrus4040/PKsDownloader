name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - {name: Unpack zip if uploaded, run: 'shopt -s nullglob; for z in *.zip; do unzip -q -o "$z" -d unpacked; done'}
      - {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: 17}}
      - {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: 8.7}}
      - {name: Find project, id: find, run: 'APP=$(find . -path "*/app/build.gradle.kts" -not -path "./.git/*" | head -1); test -n "$APP" || { echo "ERROR - app folder not found in repo"; exit 1; }; echo "dir=$(dirname "$(dirname "$APP")")" >> "$GITHUB_OUTPUT"'}
      - {name: Build debug APK, working-directory: '${{ steps.find.outputs.dir }}', run: 'gradle assembleDebug --console=plain --warning-mode none > "$GITHUB_WORKSPACE/build.log" 2>&1'}
      - {name: Show errors, if: failure(), run: 'echo "PROJECT DIR = ${{ steps.find.outputs.dir }}"; ls -la ${{ steps.find.outputs.dir }}; grep -E -m 40 "Caused by|What went wrong|Could not|e: |error:|Exception" build.log | cut -c1-220; echo ----; tail -n 25 build.log | cut -c1-220'}
      - {uses: actions/upload-artifact@v4, with: {name: PKs-Downloader-APK, path: '**/app-debug.apk'}}
